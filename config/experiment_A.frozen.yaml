# Experiment A — frozen configuration (DRAFT until the analysis script is frozen).
#
# Same rules as Experiment B's config: committed before the first run, never edited in place; a
# change means a new config_version and a new results file. Decisions: experiment-A-feedback-
# ablation.md as amended by AMENDMENTS-A-v1.md. Harness decisions inherited from AMENDMENTS-v3.md, C8.

config_version: 1
status: draft                  # becomes `frozen` at the pre-registration commit
experiment: A_feedback_ablation
spec: experiment-A-feedback-ablation.md

model:
  confirmatory: claude-sonnet-5    # full id, never an alias; verified on every call (C8)
  replication: null                # M4: full Haiku id, resolved and recorded at M4 start
  backend: claude_cli
  backend_version: null            # `claude --version` at run start; abort if it changes
  environment: {DISABLE_AUTOUPDATER: "1"}
  thinking: minimum                # --effort low
  temperature: backend_default
  max_output_tokens: backend_default
  cli:
    flags: >-
      -p --input-format text --output-format stream-json --verbose --model {pinned_snapshot} --effort low --tools "" --permission-mode dontAsk --strict-mcp-config --setting-sources "" --disable-slash-commands --system-prompt "You are a helpful assistant."
    structural_checks: see config/experiment_B.frozen.yaml model.cli.structural_checks (C8), unchanged
  context: single_user_message     # D5: no transcript; the inline rendering of C8 does not arise

domain: asp_jobshop                # maze only in exploratory M2

instances:
  seed: 20260926
  calibration_seed: 20260927       # distinct stream; calibration instances are discarded
  n_pilot: 6                       # first 6 of the frozen list; not counted in M1
  m1_target_branched: 40
  m1_min_branched: 30
  m1_max_attempt1_instances: 110
  supply_stop_rule: |
    After each batch: if the 95% Wilson upper bound of the observed branching rate, applied to the
    remaining attempt-1 budget up to the cap, leaves fewer than m1_min_branched branched instances,
    stop and report that the contrast has no material.
  path: instances/
  hash_file: instances/INSTANCES_A.sha256

calibration:
  measured_on: attempt1_success_sonnet
  target_band: [0.40, 0.60]
  band_is_a_target_not_a_gate: true
  grid: [[10, 3, 10], [12, 3, 12], [14, 4, 14], [16, 4, 16], [18, 5, 18]]  # [n_jobs, n_machines, n_precedences]
  per_point: 4
  rule: |
    Ascending, attempt 1 only, 4 instances per point from calibration_seed. Stop at the first
    point whose attempt-1 success is at or below 0.60 and select, among the points run, the one
    closest to 0.50; if none reaches the band, select the closest and record it. One pass, no
    manual adjustment.
  log: results_A/calibration.jsonl

branching:
  attempt_outcomes: [valid, invalid_schedule, no_answer_set, syntax_error, solver_timeout, unparsable]
  branch_on: [invalid_schedule, no_answer_set]
  max_attempts: 3
  arm_order: drawn per instance from instances.seed
  solver_output_truncate_chars: 1500
  clingo_timeout_seconds: 30

feedback_blocks:
  invalid_schedule:
    binary: "It did not produce a valid schedule."
    diagnostic: "The schedule it produced violates:\n{VIOLATIONS}\nClingo output: {SOLVER_OUTPUT_TRUNCATED}"
  no_answer_set:
    binary: "It did not produce a valid schedule."
    diagnostic: "Clingo found no answer set (unsatisfiable, or no start/2 atoms).\nClingo output: {SOLVER_OUTPUT_TRUNCATED}"
  syntax_error: {both: "{SOLVER_ERROR}"}
  solver_timeout: {both: "{SOLVER_TIMEOUT_MESSAGE}"}
  unparsable: {both: "Your reply contained no clingo code block."}

budget:
  caps_calls:
    calibration: 24
    pilot: 24
    m1: 280
    m2: 90
    m3: 60
    m4_haiku: 200
  on_exceed: stop_and_report
  m2_m3_decision: recorded before M1 is analysed; depends on calls available, never on results

batches:
  analysis_only_at_end: true
  interim_analysis: none
  between_batches: [structural_checks, contamination, parse_failures, cli_version, model_id,
                    branch_identity, attempt1_branching_rate]
  instance_within_one_batch: true
  batch_id_in_every_row: true
  drift_table: attempt1_success_per_batch

contamination:
  patterns_case_insensitive:        # identical to Experiment B (C8)
    - '<\s*(function_calls|invoke|tool_use|tool_result)\b'
    - '\b(bash|read|write|edit|glob|grep|webfetch|websearch|todowrite|notebookedit|task)\s+tool\b'
    - '\b(use|call|invoke|using)\s+(a|the|my)?\s*tools?\b'
    - '\b(i\s+(do\s+not|don''t|cannot|can''t)|unable\s+to)\s+(have\s+access\s+to|access|run|execute|open|read)\b'
    - '\b(let\s+me|i''ll|i\s+will)\s+(run|execute)\b'
    - '\b(file\s*system|working\s+directory|current\s+directory|claude\.md)\b'
  pilot_gate_max_per_arm: 0.02
  full_run: reported per arm, not gated

gates:
  pilot:
    max_parse_failure_rate: 0.05
    max_contamination_rate_per_arm: 0.02
  every_branched_instance:
    branch_identity: byte-identical after FEEDBACK_BLOCK is replaced by a placeholder

analysis:
  script: analysis/analyze_experiment_A.py   # to be written; frozen by sha256 before the pilot
  sha256: null
  alpha: 0.05
  primary: wilcoxon_signed_rank_one_sided
  zero_method: wilcox
  censored_value: 4
  mei_attempts: 0.25
  bootstrap: {reps: 10000, seed: 20260925}
  report_with_primary: [hodges_lehmann, bootstrap_ci95_mean_difference]
  secondary: [mcnemar_success_within_3, uptake_wilson, regression_rate]
